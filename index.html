<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>Audio Cutter</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;color:#f5f5f7;background:#0b0c0f}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#111318,#08090b);min-height:100vh}
.app{width:min(760px,100%);margin:auto;padding:24px 16px 40px}
h1{font-size:32px;margin:10px 0 4px;letter-spacing:-1px}
.sub{color:#969aa5;margin-bottom:24px}
.card{background:#17191e;border:1px solid #292c34;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 12px 35px #0005}
input[type=file]{display:none}
.pick,.btn{border:0;border-radius:14px;padding:15px 18px;font-size:17px;font-weight:650;cursor:pointer}
.pick{display:block;text-align:center;background:#f2f2f4;color:#111}
.btn{background:#252932;color:#fff;margin-top:12px;width:100%}
.btn.primary{background:#f2f2f4;color:#111}
.btn:disabled{opacity:.4}
.file{display:none}
.name{font-size:18px;font-weight:650;word-break:break-word}
.time{display:flex;justify-content:space-between;color:#9da2ad;font-variant-numeric:tabular-nums;margin-top:8px}
.wave{position:relative;height:170px;background:#0d0f13;border-radius:14px;overflow:hidden;margin:16px 0}
canvas{width:100%;height:100%;display:block}
.sel{position:absolute;top:0;bottom:0;background:#fff2;pointer-events:none}
.handle{position:absolute;top:0;bottom:0;width:4px;background:#fff;border-radius:4px;touch-action:none}
.handle:after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:22px;height:56px;border-radius:11px;background:#fff;box-shadow:0 2px 12px #0008}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{font-size:14px;color:#a8acb5}
.status{margin-top:12px;color:#9da2ad;min-height:20px}
@media(max-width:520px){h1{font-size:28px}.wave{height:145px}.app{padding-top:12px}}
</style>
</head>
<body>
<div class="app">
  <h1>Audio Cutter</h1>
  <div class="sub">Простий обрізувач аудіо. Усе працює на пристрої.</div>

  <div class="card">
    <label class="pick" for="file">＋ Вибрати аудіофайл</label>
    <input id="file" type="file" accept="audio/*,.mp3,.m4a,.wav,.aac,.caf,.aiff,.flac">
  </div>

  <div id="editor" class="card" style="display:none">
    <div class="name" id="name"></div>
    <div class="time"><span id="startText">00:00.000</span><span id="endText">00:00.000</span></div>

    <div class="wave" id="wave">
      <canvas id="canvas"></canvas>
      <div class="sel" id="sel"></div>
      <div class="handle" id="left"></div>
      <div class="handle" id="right"></div>
    </div>

    <div class="controls">
      <button class="btn" id="play">▶ Прослухати</button>
      <button class="btn" id="stop">■ Стоп</button>
    </div>
    <button class="btn primary" id="export">✂ Обрізати та зберегти WAV</button>
    <div class="small" style="margin-top:10px">Потягни білі маркери. Аудіо нікуди не передається.</div>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
let audioCtx, buffer, source;
let start=0, end=0, raf=0, playing=false;

const fileInput=document.getElementById('file');
const editor=document.getElementById('editor');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const wave=document.getElementById('wave');
const sel=document.getElementById('sel');
const left=document.getElementById('left');
const right=document.getElementById('right');
const startText=document.getElementById('startText');
const endText=document.getElementById('endText');
const status=document.getElementById('status');

function fmt(s){
  const m=Math.floor(s/60), sec=Math.floor(s%60), ms=Math.floor((s%1)*1000);
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')+'.'+String(ms).padStart(3,'0');
}
function draw(){
  const dpr=devicePixelRatio||1, r=canvas.getBoundingClientRect();
  canvas.width=r.width*dpr; canvas.height=r.height*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const w=r.width,h=r.height;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#0d0f13'; ctx.fillRect(0,0,w,h);
  if(!buffer)return;
  const data=buffer.getChannelData(0), step=Math.max(1,Math.floor(data.length/w));
  ctx.beginPath();
  for(let x=0;x<w;x++){
    let mn=1,mx=-1, a=x*step, b=Math.min(data.length,a+step);
    for(let i=a;i<b;i++){let v=data[i]; if(v<mn)mn=v;if(v>mx)mx=v;}
    const y1=h/2+mn*h*.42, y2=h/2+mx*h*.42;
    ctx.moveTo(x,y1);ctx.lineTo(x,y2);
  }
  ctx.strokeStyle='#e8e9ed';ctx.globalAlpha=.82;ctx.stroke();ctx.globalAlpha=1;
  updateUI();
}
function updateUI(){
  if(!buffer)return;
  const dur=buffer.duration, lp=start/dur*100, rp=end/dur*100;
  left.style.left=`calc(${lp}% - 2px)`; right.style.left=`calc(${rp}% - 2px)`;
  sel.style.left=lp+'%'; sel.style.width=(rp-lp)+'%';
  startText.textContent=fmt(start); endText.textContent=fmt(end);
}
function setStatus(x){status.textContent=x||''}

fileInput.onchange=async()=>{
  const f=fileInput.files[0]; if(!f)return;
  setStatus('Завантаження аудіо…');
  try{
    audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
    const arr=await f.arrayBuffer();
    buffer=await audioCtx.decodeAudioData(arr.slice(0));
    start=0; end=buffer.duration;
    document.getElementById('name').textContent=f.name;
    editor.style.display='block'; draw(); setStatus('Готово.');
    editor.scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){
    console.error(e); setStatus('Не вдалося прочитати цей формат у Safari. Спробуй MP3, M4A або WAV.');
  }
};

function pointerTime(e){
  const r=wave.getBoundingClientRect();
  const x=Math.max(0,Math.min(r.width,e.clientX-r.left));
  return x/r.width*buffer.duration;
}
function dragHandle(el,isLeft){
  let drag=false;
  el.addEventListener('pointerdown',e=>{drag=true;el.setPointerCapture(e.pointerId);e.preventDefault()});
  el.addEventListener('pointermove',e=>{
    if(!drag||!buffer)return;
    let t=pointerTime(e);
    if(isLeft) start=Math.max(0,Math.min(t,end-.01));
    else end=Math.min(buffer.duration,Math.max(t,start+.01));
    updateUI();
  });
  el.addEventListener('pointerup',()=>drag=false);
}
dragHandle(left,true); dragHandle(right,false);
window.addEventListener('resize',draw);

function stop(){
  if(source){try{source.stop()}catch{} source=null}
  playing=false; cancelAnimationFrame(raf); document.getElementById('play').textContent='▶ Прослухати';
}
document.getElementById('stop').onclick=stop;

document.getElementById('play').onclick=()=>{
  if(!buffer)return;
  stop();
  source=audioCtx.createBufferSource(); source.buffer=buffer; source.connect(audioCtx.destination);
  source.start(0,start,end-start); playing=true;
  document.getElementById('play').textContent='▶ Відтворюється…';
  source.onended=()=>{playing=false;document.getElementById('play').textContent='▶ Прослухати'};
};

function encodeWAV(buf,s,e){
  const sr=buf.sampleRate, channels=buf.numberOfChannels;
  const from=Math.floor(s*sr), to=Math.floor(e*sr), frames=to-from;
  const bytesPerSample=2, blockAlign=channels*bytesPerSample;
  const dataSize=frames*blockAlign, out=new ArrayBuffer(44+dataSize), v=new DataView(out);
  const ws=(o,str)=>{for(let i=0;i<str.length;i++)v.setUint8(o+i,str.charCodeAt(i))};
  ws(0,'RIFF');v.setUint32(4,36+dataSize,true);ws(8,'WAVE');ws(12,'fmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,channels,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*blockAlign,true);v.setUint16(32,blockAlign,true);v.setUint16(34,16,true);
  ws(36,'data');v.setUint32(40,dataSize,true);
  const chans=[];for(let c=0;c<channels;c++)chans.push(buf.getChannelData(c));
  let p=44;
  for(let i=from;i<to;i++)for(let c=0;c<channels;c++){
    let x=Math.max(-1,Math.min(1,chans[c][i]));
    v.setInt16(p,x<0?x*0x8000:x*0x7fff,true);p+=2;
  }
  return new Blob([out],{type:'audio/wav'});
}
document.getElementById('export').onclick=()=>{
  if(!buffer)return;
  stop(); setStatus('Створюю файл…');
  const blob=encodeWAV(buffer,start,end);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='audio-cut-'+Math.round(start*1000)+'-'+Math.round(end*1000)+'.wav';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  setStatus('Готово — файл збережено/передано через Safari.');
};
</script>
</body>
</html>
